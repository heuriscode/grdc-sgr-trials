project:
  research_cost_total:
    central: 13700000
    low: 13700000
    high: 13700000
    unit: $ (GRDC $7.6M + University of Adelaide $6.1M), treated as real
    source: GRDC Groundcover announcement 2024 (farming systems project to inform decision making for southern growers)
    status: snippet
  first_investment_year: 2023
  last_investment_year: 2027
  adoption_start_year: 2028    # results released mid-2027; lag is added on top
  probability_of_success:
    central: 0.6
    low: 0.5
    high: 0.7
    unit: probability the trials yield a robust, extendable recommendation
    source: "Pannell 2024 (failure probabilities usually set too low); no published figure for farming-systems research"
    status: judgement
  attribution_share:
    central: 0.35
    low: 0.2
    high: 0.5
    unit: share of the adoption change credited to this project
    source: "Several groups/programmes work on the same practices (BCG, Hart, MSF, SFS, other GRDC investments); NSW DPI ERR 19 credited 35% of conservation farming to DPI"
    status: judgement
  adoption_advance_years:
    central: 7
    low: 5
    high: 10
    unit: years earlier than without the project
    source: "Project lead ruling 25 Nov 2026 (5-10 years): a multi-site, multi-season systems trial is the main source of local evidence for these systems, so without it uptake would wait on growers' own trial and error. Mechanism (advance, not a higher ceiling): Marsh, Pannell & Lindner 2000 (WA lupins)"
    status: judgement
  counterfactual_ceiling_share:
    central: 1.0
    low: 0.8
    high: 1.0
    unit: without-project ceiling as a share of the with-project ceiling
    source: "Marsh, Pannell & Lindner 2000 (ceiling unchanged by extension); low case lets the project lift the ceiling 25%"
    status: judgement

risk:
  wealth_per_ha:
    central: 7000
    low: 4000
    high: 10000
    unit: $ farm equity per crop ha (starting wealth for CRRA in SERF)
    source: "ABARES benchmarks 2006-07 to 2008-09: equity A$1,683-2,765 per ha operated, equity ratio 85-89% (Hooper & Levantis 2011 via Greijdanus & Kragt 2014, UWA WP1400002), scaled for CPI and farmland value growth since; current zone figures not obtainable (ABARES blocked)"
    status: judgement
