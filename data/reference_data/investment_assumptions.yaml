# Adoption by system class. ceiling_share = share of the zone's crop area that eventually
# changes, BEYOND what was happening anyway. Evidence base: GRDC Farm Practices Survey 2021
# (pulse share 22-24% of SA/Vic crop area and price-driven; N decision tools used by 22% of
# southern growers; VRT 11% of national crop area after 15+ years); ABS 2016-17 (intercropping
# area -20% y/y and -50% 2011-12 to 2013-14; cover cropping 189 kha, <1% of crop area);
# Raffeld et al. 2025 (ADOPT studies: mean years to peak 9-19).
adoption:
  joint_cap_share:
    central: 0.20
    low: 0.15
    high: 0.30
    unit: max combined share of zone crop area changing system (systems compete for paddocks)
    source: Analyst cap so overlapping systems are not double counted
    status: judgement
  evidence_threshold:
    central: 0.5
    low: 0.5
    high: 0.8
    unit: stress test - minimum bootstrap probability that the mean GM gain over baseline is positive before any adoption is credited (0.5 = off; adoption is already conditioned on a positive gain draw by draw)
    source: "Analyst rule reflecting adoption evidence - practices spread when the relative advantage is clear and observable (Pannell et al. 2006, Aust J Exp Agric 46:1407-1424); three trial seasons give wide intervals"
    status: judgement
  rotation:   # more pulses, pulse-canola, pulse on pulse, alternative pulse, canola, more cereals
    ceiling_share: {central: 0.08, low: 0.03, high: 0.15, unit: share of zone crop area, source: "FPS 2021 Table 17 - pulse share already 22-24% in SA/Vic zones, rise price-driven; lentils ~30 yrs to >1 Mha (Sadras et al. 2021)", status: judgement}
    years_to_peak: {central: 12, low: 8, high: 15, unit: years, source: "Raffeld et al. 2025 - ADOPT studies average 9-19 years to peak", status: snippet}
    lag_years: {central: 3, low: 2, high: 4, unit: years after results released, source: "Lupins/lentils start-up lags; Marsh, Pannell & Lindner 2000", status: judgement}
    disadoption_rate: {central: 0.02, low: 0.0, high: 0.05, unit: share per year after peak, source: "Zone pulse shares fell between FPS surveys in some zones (FPS 2021)", status: judgement}
    farm_share_converted: {central: 0.5, low: 0.3, high: 1.0, unit: share of farm crop area, source: Rotation change applies to part of the farm, status: judgement}
    farm_ramp_years: {central: 3, low: 2, high: 4, unit: years, source: One rotation cycle to convert, status: judgement}
    extra_labour_hours_per_ha: {central: 0.1, low: 0.0, high: 0.2, unit: h/ha/yr, source: Extra marketing/management of more crop types, status: judgement}
    learning_cost_per_ha: {central: 10, low: 0, high: 25, unit: $/ha/yr while learning, source: Agronomy learning (e.g. pulse disease/herbicide management), status: judgement}
    learning_years: {central: 1, low: 1, high: 2, unit: years, source: judgement, status: judgement}
  responsive:  # adviser-led, N bank, less chemical, organic fertiliser, soil health
    ceiling_share: {central: 0.08, low: 0.03, high: 0.15, unit: share of zone crop area, source: "FPS 2021 Table 82 - 22% of southern growers already use N decision support tools; Yield Prophet reached ~1% of growers (Hunt et al. 2006)", status: judgement}
    years_to_peak: {central: 10, low: 8, high: 12, unit: years, source: Raffeld et al. 2025, status: snippet}
    lag_years: {central: 3, low: 2, high: 4, unit: years, source: judgement, status: judgement}
    disadoption_rate: {central: 0.03, low: 0.0, high: 0.05, unit: share per year after peak, source: judgement, status: judgement}
    farm_share_converted: {central: 0.5, low: 0.3, high: 1.0, unit: share of farm crop area, source: judgement, status: judgement}
    farm_ramp_years: {central: 2, low: 1, high: 3, unit: years, source: judgement, status: judgement}
    extra_labour_hours_per_ha: {central: 0.2, low: 0.1, high: 0.4, unit: h/ha/yr, source: "Monitoring, soil testing, adviser time (proxy for adviser fees)", status: judgement}
    learning_cost_per_ha: {central: 5, low: 0, high: 15, unit: $/ha/yr while learning, source: judgement, status: judgement}
    learning_years: {central: 1, low: 1, high: 2, unit: years, source: judgement, status: judgement}
  cover_crop:  # winter cover cropping, fallow
    ceiling_share: {central: 0.02, low: 0.005, high: 0.05, unit: share of zone crop area, source: "ABS 2016-17 Land Management and Farming - cover cropping 189 kha (<1% of crop area), down 6%; water cost under Mediterranean rainfall (Nordblom et al. 2023)", status: snippet}
    years_to_peak: {central: 12, low: 10, high: 15, unit: years, source: Raffeld et al. 2025, status: snippet}
    lag_years: {central: 4, low: 3, high: 5, unit: years, source: judgement, status: judgement}
    disadoption_rate: {central: 0.05, low: 0.03, high: 0.10, unit: share per year after peak, source: "ABS cover crop area falling", status: judgement}
    farm_share_converted: {central: 0.10, low: 0.05, high: 0.20, unit: share of farm crop area, source: judgement, status: judgement}
    farm_ramp_years: {central: 2, low: 1, high: 3, unit: years, source: judgement, status: judgement}
    extra_labour_hours_per_ha: {central: 0.1, low: 0.0, high: 0.2, unit: h/ha/yr, source: judgement, status: judgement}
    learning_cost_per_ha: {central: 10, low: 0, high: 25, unit: $/ha/yr while learning, source: judgement, status: judgement}
    learning_years: {central: 1, low: 1, high: 2, unit: years, source: judgement, status: judgement}
  multicrop:   # intercropping, companion cropping
    ceiling_share: {central: 0.02, low: 0.005, high: 0.05, unit: share of zone crop area, source: "ABS 4627.0 2016-17 - intercropping area -20% y/y and -50% 2011-12 to 2013-14; 'not widely used' because of labour and complexity (CSIRO, Crop & Pasture Science CP16211)", status: snippet}
    years_to_peak: {central: 12, low: 10, high: 15, unit: years, source: Raffeld et al. 2025, status: snippet}
    lag_years: {central: 4, low: 3, high: 5, unit: years, source: judgement, status: judgement}
    disadoption_rate: {central: 0.07, low: 0.03, high: 0.10, unit: share per year after peak, source: "ABS intercropping area falling despite more businesses", status: judgement}
    farm_share_converted: {central: 0.15, low: 0.05, high: 0.25, unit: share of farm crop area, source: Paddocks suited to a break-crop intercrop, status: judgement}
    farm_ramp_years: {central: 3, low: 2, high: 4, unit: years, source: judgement, status: judgement}
    extra_labour_hours_per_ha: {central: 0.5, low: 0.25, high: 1.0, unit: h/ha/yr, source: "Sowing, harvest, handling, segregation and selling two grains (Roberts et al. 2022)", status: judgement}
    learning_cost_per_ha: {central: 40, low: 15, high: 80, unit: $/ha/yr while learning, source: "Yield/quality losses while learning; contract cleaning cut GM $30-60/ha at Waikerie (Roberts et al. 2019)", status: judgement}
    learning_years: {central: 2, low: 1, high: 3, unit: years, source: judgement, status: judgement}
  hay:
    ceiling_share: {central: 0.03, low: 0.01, high: 0.06, unit: share of zone crop area, source: "Hay area is market-driven and volatile; requires existing contractor access", status: judgement}
    years_to_peak: {central: 6, low: 5, high: 8, unit: years, source: judgement, status: judgement}
    lag_years: {central: 1, low: 1, high: 2, unit: years, source: judgement, status: judgement}
    disadoption_rate: {central: 0.08, low: 0.05, high: 0.10, unit: share per year after peak, source: judgement, status: judgement}
    farm_share_converted: {central: 0.15, low: 0.10, high: 0.25, unit: share of farm crop area, source: judgement, status: judgement}
    farm_ramp_years: {central: 1, low: 1, high: 2, unit: years, source: judgement, status: judgement}
    extra_labour_hours_per_ha: {central: 0.0, low: 0.0, high: 0.2, unit: h/ha/yr, source: Contract hay making; only farms with access assumed to adopt, status: judgement}
    learning_cost_per_ha: {central: 0, low: 0, high: 10, unit: $/ha/yr while learning, source: judgement, status: judgement}
    learning_years: {central: 1, low: 1, high: 1, unit: years, source: judgement, status: judgement}
  pasture:
    ceiling_share: {central: 0.02, low: 0.0, high: 0.05, unit: share of zone crop area, source: "Trend is pasture to crop (PIRSA crop & pasture report 2023-24: lentils expanding at the expense of pasture); needs livestock or agistment market", status: snippet}
    years_to_peak: {central: 12, low: 10, high: 15, unit: years, source: Raffeld et al. 2025, status: snippet}
    lag_years: {central: 4, low: 3, high: 5, unit: years, source: judgement, status: judgement}
    disadoption_rate: {central: 0.05, low: 0.03, high: 0.10, unit: share per year after peak, source: judgement, status: judgement}
    farm_share_converted: {central: 0.20, low: 0.10, high: 0.33, unit: share of farm crop area, source: judgement, status: judgement}
    farm_ramp_years: {central: 3, low: 2, high: 4, unit: years, source: judgement, status: judgement}
    extra_labour_hours_per_ha: {central: 0.2, low: 0.1, high: 0.4, unit: h/ha/yr, source: Managing agistment (fencing/water checks); infrastructure assumed already present, status: judgement}
    learning_cost_per_ha: {central: 10, low: 0, high: 25, unit: $/ha/yr while learning, source: judgement, status: judgement}
    learning_years: {central: 1, low: 1, high: 2, unit: years, source: judgement, status: judgement}

