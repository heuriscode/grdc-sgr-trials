# Investment (benefit-cost) analysis assumptions
#
# Every number is a parameter block: central / low / high, unit, source, status.
#   status: verified  - read from the cited source
#           snippet   - from a search extract; the source page could not be opened (check before publishing)
#           judgement - analyst assumption; confirm before publishing
#           data      - derived from trial data or a data file in this repo
# "low" and "high" are numeric bounds (low <= central <= high), not pessimistic/optimistic;
# for years-to-peak and lag the HIGH number is the pessimistic one.
#
# Rulings (project lead, 24 Nov 2026): baseline rule 'auto' and the broad-category mapping accepted
# as recommended; judgement-status cost placeholders (multicrop capital, hay making, agistment) accepted
# for the milestone, to be replaced by quotes when available.
# Principle (project lead, 24 Nov 2026): realistic assumptions everywhere. Ex-ante RDC
# impact assessments are known to overstate adoption (Productivity Commission 2011, Rural
# Research and Development Corporations, pp.109, 123; Pannell 2024; Hurley, Rao & Pardey 2014).
# No-till and similar exceptional innovations are NOT used as analogues.

meta:
  base_year: 2026          # present values in 2026 real dollars
  currency: AUD, real 2025-26 dollars
  version: 1

discounting:
  public_rate:
    central: 0.05
    low: 0.03
    high: 0.07
    unit: real p.a.
    source: CRRDC Impact Assessment Guidelines (2018 V2) as applied in Agtrans/RDC impact assessments; 7% is the Office of Impact Analysis rate
    status: snippet
  farm_rate:
    central: 0.06
    low: 0.04
    high: 0.08
    unit: real p.a.
    source: RBA F5 small-business variable rate 9.25% (Oct 2026) and F7 new small-business loans 7.14% (Sep 2026), less ~3% CPI = ~4-6% real; central allows a modest risk margin
    status: judgement

horizons:
  farm_years:
    central: 20
    low: 15
    high: 25
    unit: years
    source: Typical farm investment appraisal horizon; long enough for several rotation cycles
    status: judgement
  project_years_after_investment:
    central: 30
    low: 30
    high: 30
    unit: years
    source: CRRDC Impact Assessment Guidelines - investment period plus 30 years
    status: snippet

seasons:
  # Weights on trial years when drawing a season. Equal by default; set e.g.
  # HART: {2023: 1.0, 2024: 0.6, 2025: 1.0} to tilt towards long-run rainfall deciles.
  year_weights:
    default: {}

prices:
  central_statistic: median   # median or mean of the real price window
  central_window_years:
    central: 10
    low: 5
    high: 15
    unit: years
    source: "Central price = median real (CPI FY-mean, 2025-26 $) price over the most recent N years of price_history.csv - FAOSTAT producer prices for Australia (ABS gross unit values) 1995-2025 plus ABS levy local values 2022-23 to 2024-25; pulse series have gaps"
    status: data
  grain_price_level:
    central: 1.0
    low: 0.9
    high: 1.1
    unit: multiplier on central grain prices
    source: Scenario range for long-run real grain prices
    status: judgement
  hay_price_per_t:
    central: 250
    low: 200
    high: 330
    unit: $/t cereal/vetch hay
    source: Dairy Australia / AFIA Hay Report Weekly Insights, 31 Oct 2025 (old-season oaten low $200s; new-season ~$300; export oaten $305-330)
    status: snippet
  hay_making_cost_per_t:
    central: 55
    low: 40
    high: 75
    unit: $/t (contract mow, rake, bale, cart)
    source: Contractor rate cards not located - placeholder pending a quote
    status: judgement
  agistment_value_per_ha:
    central: 90
    low: 40
    high: 150
    unit: $/ha per pasture year
    source: Approx. 6-10 DSE/ha x 30 weeks x $0.30-0.50/DSE/week; no published SA/Vic agistment rate survey found
    status: judgement
  agistment_cv:
    central: 0.3
    low: 0.2
    high: 0.4
    unit: coefficient of variation
    source: Seasonal variability of agistment demand
    status: judgement

costs:
  operations_level_index:
    central: 1.25
    low: 1.10
    high: 1.40
    unit: multiplier on recorded operating costs (ActivitiesCosts.csv rates are 2020-21)
    source: Movement in contract rates/fuel 2020-21 to 2025-26; confirm against the 2026 Farm Gross Margin & Enterprise Planning Guide (Ag Ex Alliance)
    status: judgement
  other_materials_level_index:
    central: 1.0
    low: 0.9
    high: 1.2
    unit: multiplier on recorded non-urea material costs
    source: Product prices in the reference product tables are taken as current
    status: judgement
  urea_level_index:
    central: 1.0
    low: 0.9
    high: 1.3
    unit: multiplier on recorded urea costs
    source: Reference urea price taken as current; 2026 shock handled as a scenario
    status: judgement
  urea_price_cv:
    central: 0.30
    low: 0.20
    high: 0.40
    unit: coefficient of variation (used only if no urea history in price_history.csv)
    source: Urea moved from ~A$675/t (Feb 2026) to A$1,000-1,350/t (Mar-Apr 2026) - UWA Apr 2026; Reuters Apr 2026; ABARES Jun 2026
    status: snippet
  operations_cost_cv:
    central: 0.10
    low: 0.05
    high: 0.15
    unit: coefficient of variation (used only if no diesel history)
    source: Fuel-driven variation in contract rates
    status: judgement
  other_materials_cv:
    central: 0.10
    low: 0.05
    high: 0.15
    unit: coefficient of variation
    source: Chemical/seed price variation
    status: judgement
  shock_urea_multiplier:
    central: 1.6
    low: 1.4
    high: 1.8
    unit: multiplier (input-shock scenario)
    source: Australian urea ~+60% (Reuters, Apr 2026) to +80% domestic (ABARES, Jun 2026)
    status: snippet
  shock_operations_multiplier:
    central: 1.15
    low: 1.05
    high: 1.25
    unit: multiplier (input-shock scenario)
    source: Diesel ~+88% (Reuters, Apr 2026) applied to the fuel share (~15-25%) of contract operations
    status: judgement
  labour_rate_per_hour:
    central: 45
    low: 35
    high: 60
    unit: $/hour incl. on-costs (owner/manager or employee time)
    source: Pastoral Award farm hand rates plus on-costs; owner time at the same rate
    status: judgement

